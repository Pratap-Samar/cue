name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats

      - name: Syntax Check
        run: bash -n cue lib/*.sh tests/cue.bats

      - name: ShellCheck
        run: shellcheck --severity=warning cue lib/*.sh tests/cue.bats

      - name: Bats Tests
        run: bats tests/cue.bats
